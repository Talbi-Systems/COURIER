<!DOCTYPE html>
<html lang="en">
<head>
    <title>Credit Card Payment</title>
    <link rel="stylesheet" href="pay.css">
</head>
<body>
    <form action="payment-accepted.html" method="POST" onsubmit="return validateForm()">
        <input type="text" name="cardholder_name" placeholder="Cardholder Name" required pattern="[A-Za-z ]+" title="Name can only include letters and spaces">
        <input type="text" name="card_number" placeholder="Card Number" required maxlength="16" pattern="\d{16}" title="Card number must be 16 digits">
        <input type="text" name="expiry_date" placeholder="MM/YY" required pattern="(0[1-9]|1[0-2])\/([0-9]{2})" title="Enter a valid date in MM/YY format">
        <input type="text" name="cvv" placeholder="CVV" required maxlength="3" pattern="\d{3}" title="CVV must be 3 digits">

        <button type="submit">Pay</button>
    </form>
    <script>
        function validateForm() {
            // This function is optional as the "required" and "pattern" attributes already handle validation.
            return true; // Let the form proceed if all validations pass.
        }
    </script>
</body>
</html>
